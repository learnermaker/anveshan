name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check repository governance invariants
        run: python .github/scripts/check_governance.py

      - name: Check capability case-pack structure
        run: python .github/scripts/check_case_packs.py

      - name: Test case-pack manifest validation
        run: python -m pytest .github/scripts/test_check_case_packs.py

      - name: Check canonical Python -> UI contract parity
        run: python .github/scripts/check_contract_parity.py

      - name: Run Python tests (common, tracks, service; no live model calls)
        run: |
          dirs=""
          for d in tracks/common/tests tracks/track-a/tests tracks/track-b/tests service/tests; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          python -m pytest $dirs -m "not live"

      - name: Validate PR contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/check_pr_contract.py

      - name: Syntax-check benchmark scripts
        run: python -m compileall -q research/benchmarks/scripts

      - name: Run temporal scorer smoke test
        run: python research/benchmarks/scripts/score_temporal.py --truth 22 --pred 22.5 --tolerance 2

      - name: Run event scorer smoke test
        run: |
          printf '%s\n' '{"truth":[{"timestamp":10,"action":"open"}],"pred":[{"timestamp":10.5,"action":"open"}]}' > /tmp/events.json
          python research/benchmarks/scripts/score_events.py /tmp/events.json

      - name: Build frontend
        working-directory: app
        run: npm install --no-audit --no-fund && npm run build
