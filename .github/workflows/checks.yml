name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check repository governance invariants
        run: python .github/scripts/check_governance.py

      - name: Check for duplicate files (single-copy rule)
        run: python .github/scripts/check_duplicates.py

      - name: Check capability case-pack structure
        run: python .github/scripts/check_case_packs.py

      - name: Test case-pack manifest validation
        run: python -m pytest .github/scripts/test_check_case_packs.py

      - name: Check canonical Python -> UI contract parity
        run: python .github/scripts/check_contract_parity.py

      - name: Run Python tests (common, tracks, service; no live model calls)
        run: |
          dirs=""
          for d in tracks/common/tests tracks/track-a/tests tracks/track-b/tests service/tests; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          python -m pytest $dirs -m "not live"

      - name: Validate PR contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/check_pr_contract.py

      - name: Syntax-check benchmark scripts
        run: python -m compileall -q research/benchmarks/scripts

      - name: Run temporal scorer smoke test
        run: python research/benchmarks/scripts/score_temporal.py --truth 22 --pred 22.5 --tolerance 2

      - name: Run event scorer smoke test
        run: |
          printf '%s\n' '{"truth":[{"timestamp":10,"action":"open"}],"pred":[{"timestamp":10.5,"action":"open"}]}' > /tmp/events.json
          python research/benchmarks/scripts/score_events.py /tmp/events.json

      - name: Build frontend
        working-directory: app
        run: npm install --no-audit --no-fund && npm run build

  docker-image:
    # Proves the Cloud Run image builds (multi-stage app build, pinned runtime deps, licensed media
    # fetch with sha256 checks) and that the container serves /api/health, before anyone deploys it.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the container image
        run: docker build -t anveshan:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name anv -p 8080:8080 -e K_SERVICE=ci anveshan:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 2; done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'
          curl -fsS http://localhost:8080/api/cases | grep -q '"kolam"'
          curl -fsS -o /dev/null http://localhost:8080/
          docker logs anv | tail -20
