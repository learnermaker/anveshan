name: checks
on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check repository governance invariants
        run: python .github/scripts/check_governance.py
      - name: Syntax-check benchmark scripts
        run: python -m compileall -q research/benchmarks/scripts
      - name: Run temporal scorer smoke test
        run: python research/benchmarks/scripts/score_temporal.py --truth 22 --pred 22.5 --tolerance 2
      - name: Run event scorer smoke test
        run: |
          printf '%s\n' '{"truth":[{"timestamp":10,"action":"open"}],"pred":[{"timestamp":10.5,"action":"open"}]}' > /tmp/events.json
          python research/benchmarks/scripts/score_events.py /tmp/events.json

  pr-governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          checks = {
              "issue linkage": re.search(r"(?im)^\s*(?:-\s*)?(?:closes|fixes|resolves)\s+#\d+\s*$", body),
              "scope included section": re.search(r"(?im)^\s*\*\*Included\*\*\s*$", body),
              "scope excluded section": re.search(r"(?im)^\s*\*\*Not included\*\*\s*$", body),
              "validation section": re.search(r"(?im)^\s*##\s+Validation\s*$", body),
          }
          missing = [name for name, match in checks.items() if not match]
          if missing:
              raise SystemExit("Missing PR contract: " + ", ".join(missing))
          print("PR contract: PASS")
          PY
