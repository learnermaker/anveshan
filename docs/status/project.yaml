# Project status schema
# This file is the machine-readable coordination contract for agents.

schema_version: 1
project:
  name: anveshan
  phase: active_development
  default_branch: main
  current_gate: M1
  work_states: [BACKLOG, READY, IN_PROGRESS, IN_REVIEW, VALIDATING, DONE, BLOCKED, DEFERRED, REJECTED, SUPERSEDED]
  decision_states: [EXPLORATION, PROPOSED, DECIDED, VALIDATED, IMPLEMENTED, SUPERSEDED]
  scope_buckets:
    NOW: current gate or explicitly approved MVP work
    NEXT: post-gate possibilities
    EXPLORE: research only
    REJECTED: rejected or superseded work
  rules:
    implementation_requires_issue: true
    explicit_scope_boundary: true
    pull_request_requires_issue: true
    scope_change_requires_trade: true
    research_does_not_authorize_implementation: true
    technical_capability_does_not_authorize_product_scope: true
    ai_changes_require_evaluation: true
    validation_claims_require_evidence: true
  current_mvp:
    exact_domain: DECIDED  # hero cases: kolam (image), origami (video), tabla (audio)
    exact_skill: DECIDED   # kolam: Ithayakkamalam from final image; origami: crane to bird base; tabla: theka segment
    expert: INTERNET_REFERENCE  # licensed internet sources; no human expert recordings for the hackathon build
    learner: UPLOAD_OR_SYNTHETIC  # uploaded attempts or labelled synthetic perturbations
    rubric: DECIDED  # generated from goal models (docs/plans/evaluation-core.md), human-approved
  hero_cases: [kolam, origami, tabla]
  showcase_cases_synthetic: [micrometer, bicycle-repair, handloom-weaving, square-knot]
  models:
    text_image: gemma-4-26b-a4b-it
    video_frames: gemma-4-26b-a4b-it
    audio: optional_disabled_by_default
  progress_unit: product_capability
